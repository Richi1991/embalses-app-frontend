<ion-content [fullscreen]="true" class="mapa-content" scrollX="false" scrollY="false">

  <div class="map-wrapper">
    
    <div id="map"></div>

    <div class="map-ui-overlay">
      
      <div class="map-layer-buttons">
        <button class="layer-pill" [class.active]="layers.embalses" (click)="toggleLayer('embalses')">
          Embalses
        </button>
        <button class="layer-pill" [class.active]="layers.estaciones" (click)="toggleLayer('estaciones')">
          Estaciones
        </button>
        <button class="layer-pill" [class.active]="layers.caudales" (click)="mostrarCaudales = !mostrarCaudales">
          Caudales
        </button>
      </div>

      <app-caudal *ngIf="mostrarCaudales" [mapa]="map"></app-caudal>

      <button class="theme-btn" (click)="toggleTheme()" [title]="lightMode ? 'Modo oscuro' : 'Modo claro'">
        <span class="theme-icon">{{ lightMode ? '🌙' : '☀️' }}</span>
      </button>

      <div class="map-stats" [class.panel-open]="panelOpen">
        <ng-container *ngIf="activeTab === 'embalses' || !layers.estaciones">
          <div class="stat-pill">
            <span class="stat-label">Vol. Total</span>
            <span class="stat-value green">{{ totalVol | number:'1.1-1' }} hm³</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Capacidad</span>
            <span class="stat-value">{{ totalPct | number:'1.2-2' }}%</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Embalses</span>
            <span class="stat-value blue">{{ embalses.length }}</span>
          </div>
        </ng-container>

        <ng-container *ngIf="activeTab === 'estaciones' && layers.estaciones && estacionesLoaded">
          <div class="stat-pill">
            <span class="stat-label">Estaciones</span>
            <span class="stat-value blue">{{ estaciones.length }}</span>
          </div>
          <div class="stat-pill">
            <span class="stat-label">Con lluvia 24h</span>
            <span class="stat-value" style="color:#0099ff">
              {{ estacionesConLluvia }}
            </span>
          </div>
        </ng-container>
      </div>

      <div class="period-bar" *ngIf="layers.estaciones && activeTab === 'estaciones'">
        <span class="period-bar-label">Período</span>
        <div class="period-selector">
          <button *ngFor="let p of periods" 
                  [class.active]="activePeriod === p.value" 
                  class="period-btn"
                  (click)="cargarEstacionesDesdeBotoneraTiempo(p.value)">
            {{ p.label }}
          </button>
        </div>
      </div>

    </div> </div> </ion-content>
