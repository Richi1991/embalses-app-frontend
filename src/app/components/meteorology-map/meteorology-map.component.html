<div class="map-toggle">
  <button class="chip" [class.on-teal]="showEmbalses" (click)="toggleLayer('embalses')">
    <div class="chip-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 5h10v7a1 1 0 01-1 1H4a1 1 0 01-1-1V5z"
          [attr.fill]="showEmbalses ? 'rgba(6,182,212,0.3)' : 'rgba(255,255,255,0.1)'"
          [attr.stroke]="showEmbalses ? '#22d3ee' : 'rgba(255,255,255,0.2)'" stroke-width="1" />
        <clipPath id="dam-clip">
          <path d="M3 5h10v7a1 1 0 01-1 1H4a1 1 0 01-1-1V5z" />
        </clipPath>
        <rect x="3" y="9" width="10" height="4"
          [attr.fill]="showEmbalses ? 'rgba(6,182,212,0.5)' : 'rgba(255,255,255,0.05)'" clip-path="url(#dam-clip)" />
        <path d="M2 5h12" [attr.stroke]="showEmbalses ? '#22d3ee' : 'rgba(255,255,255,0.2)'" stroke-width="1.2"
          stroke-linecap="round" />
        <path d="M5 5V3.5M8 5V2.5M11 5V3.5" [attr.stroke]="showEmbalses ? '#67e8f9' : 'rgba(255,255,255,0.15)'"
          stroke-width="1" stroke-linecap="round" />
        <path d="M3 9h10" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" stroke-linecap="round" />
      </svg>
    </div>
    Embalses
    <span class="chip-dot"></span>
  </button>

  <button class="chip" [class.on-blue]="showCauces" (click)="toggleLayer('cauces')">
    <div class="chip-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 5c1.5 0 1.5 1.5 3 1.5S7 5 8.5 5s1.5 1.5 3 1.5S13 5 14 5"
          [attr.stroke]="showCauces ? '#60a5fa' : 'rgba(255,255,255,0.2)'" stroke-width="1.2" stroke-linecap="round" />
        <path d="M2 8c1.5 0 1.5 1.5 3 1.5S7 8 8.5 8s1.5 1.5 3 1.5S13 8 14 8"
          [attr.stroke]="showCauces ? '#93c5fd' : 'rgba(255,255,255,0.15)'" stroke-width="1" stroke-linecap="round" />
        <path d="M2 11c1.5 0 1.5 1.5 3 1.5S7 11 8.5 11s1.5 1.5 3 1.5S13 11 14 11"
          [attr.stroke]="showCauces ? '#bfdbfe' : 'rgba(255,255,255,0.1)'" stroke-width="0.8" stroke-linecap="round" />
      </svg>
    </div>
    Cauces
    <span class="chip-dot"></span>
  </button>

  <button class="chip" [class.on-violet]="showEstaciones" (click)="toggleLayer('estaciones')">
    <div class="chip-icon">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M8 2C5.8 2 4 3.8 4 6c0 .4.1.8.2 1.1C3 7.4 2 8.6 2 10c0 1.7 1.3 3 3 3h6.5C13 13 14 12 14 10.7c0-1.1-.7-2-1.8-2.3C12.4 8 12.5 7.5 12.5 7c0-2.2-2-4-4.5-4z"
          [attr.fill]="showEstaciones ? 'rgba(139,92,246,0.3)' : 'rgba(255,255,255,0.1)'"
          [attr.stroke]="showEstaciones ? '#a78bfa' : 'rgba(255,255,255,0.2)'" stroke-width="1" />
        <path d="M5.5 13.5l-.5 1.5M8 13.5l-.5 1.5M10.5 13.5l-.5 1.5"
          [attr.stroke]="showEstaciones ? '#c4b5fd' : 'rgba(255,255,255,0.2)'" stroke-width="1"
          stroke-linecap="round" />
      </svg>
    </div>
    Estaciones
    <span class="chip-dot"></span>
  </button>
</div>

<div id="mapId" class="map-container"></div>

<app-embalse-marker #embalseMarker *ngIf="map" [map]="map" [reservoirs]="reservoirs" [iconSize]="32">
</app-embalse-marker>
